<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Compound structure and meaning"><rect width="1000" height="220" rx="22" fill="#faf5fc"/><text x="36" y="39" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#52305e">Compound structure and meaning</text><rect x="36.0" y="62" width="300.0" height="128" rx="16" fill="#e8d9f0"/><text x="50.0" y="93" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#80509d">ENDOCENTRIC</text><text x="50.0" y="123" font-family="Arial,sans-serif" font-size="16" fill="#4e4055">arm + chair</text><text x="50.0" y="147" font-family="Arial,sans-serif" font-size="16" fill="#4e4055">a kind of chair</text><rect x="350.0" y="62" width="300.0" height="128" rx="16" fill="#e8d9f0"/><text x="364.0" y="93" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#80509d">EXOCENTRIC</text><text x="364.0" y="123" font-family="Arial,sans-serif" font-size="16" fill="#4e4055">pick + pocket</text><text x="364.0" y="147" font-family="Arial,sans-serif" font-size="16" fill="#4e4055">a person</text><rect x="664.0" y="62" width="300.0" height="128" rx="16" fill="#e8d9f0"/><text x="678.0" y="93" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#80509d">COORDINATIVE</text><text x="678.0" y="123" font-family="Arial,sans-serif" font-size="16" fill="#4e4055">actor-director</text><text x="678.0" y="147" font-family="Arial,sans-serif" font-size="16" fill="#4e4055">two roles</text></svg>