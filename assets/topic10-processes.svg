<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Two different morphological operations"><rect width="1000" height="220" rx="22" fill="#faf5fc"/><text x="36" y="39" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#52305e">Two different morphological operations</text><rect x="36.0" y="62" width="457.0" height="128" rx="16" fill="#e8d9f0"/><text x="50.0" y="93" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#80509d">INFLECTION</text><text x="50.0" y="123" font-family="Arial,sans-serif" font-size="16" fill="#4e4055">teacher → teachers</text><text x="50.0" y="147" font-family="Arial,sans-serif" font-size="16" fill="#4e4055">same lexeme</text><rect x="507.0" y="62" width="457.0" height="128" rx="16" fill="#e8d9f0"/><text x="521.0" y="93" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#80509d">DERIVATION</text><text x="521.0" y="123" font-family="Arial,sans-serif" font-size="16" fill="#4e4055">teach → teacher</text><text x="521.0" y="147" font-family="Arial,sans-serif" font-size="16" fill="#4e4055">new lexeme</text></svg>